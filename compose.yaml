# MillieBeanCounter. The .command files run `docker compose` with this file for you.
name: millie_bean_counter

services:
  sync:
    build: .
    image: millie_bean_counter:2.0.2
    pull_policy: never
    init: true
    restart: unless-stopped
    command: ["serve"]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    environment:
      MILLIE_DATA: /data
      TZ: America/New_York
    volumes:
      # Settings (including passwords), the "already logged" journal and status
      # live here, inside Docker, never in this folder.
      - data:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    healthcheck:
      test: ["CMD", "python", "-m", "millie_bean_counter", "health"]
      interval: 5m
      timeout: 30s
      start_period: 2m
      retries: 2
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  data:
    name: millie_bean_counter_data
